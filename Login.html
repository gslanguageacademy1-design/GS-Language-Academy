<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - GS Language Academy</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f4f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #672a1f;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #fffaf8;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(103, 42, 31, 0.12);
            text-align: center;
        }

        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            color: #7f3025;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b625b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .question {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .login-type {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .type-btn {
            flex: 1;
            padding: 13px 8px;
            border: 2px solid #e4c8c1;
            background: white;
            color: #7f3025;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .type-btn:hover {
            border-color: #a93d2f;
        }

        .type-btn.active {
            background: #a93d2f;
            color: white;
            border-color: #a93d2f;
        }

        .login-form {
            text-align: left;
        }

        body.rtl .login-form {
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #672a1f;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #dec9c4;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #a93d2f;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #a93d2f;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #7f3025;
        }

        .register-link {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
        }

        .register-link a {
            color: #a93d2f;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .contact-info {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #eadbd7;
            font-size: 12px;
            line-height: 1.8;
            color: #8b625b;
        }

        .contact-info a {
            color: #7f3025;
            text-decoration: none;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 24px;
            }

            .type-btn {
                font-size: 13px;
                padding: 12px 5px;
            }

    </style>

        <input
            type="password"

            data-i18n-placeholder="passwordPlaceholder"
            placeholder="Enter your password"

    <!-- ================================= -->

        <input
            type="password"

/* =====================================================
   GET SAVED LANGUAGE
   ===================================================== */

function getLanguage() {

    let language =
        localStorage.getItem("language");

    if (
        language !== "en" &&
        language !== "es" &&
        language !== "ar"
    ) {

        language = "en";

    }

    return language;
}


/* =====================================================
   APPLY LANGUAGE
   ===================================================== */

function applyLanguage() {

    const language =
        getLanguage();

    const text =
        translations[language];


    /* HTML LANGUAGE */

    document.documentElement.lang =
        language;


    /* RTL FOR ARABIC */

    if (language === "ar") {

        document.documentElement.dir =
            "rtl";

        document.body.classList.add("rtl");

    } else {

        document.documentElement.dir =
            "ltr";

        document.body.classList.remove("rtl");

    }


    /* NORMAL TEXT */

    document
        .querySelectorAll("[data-i18n]")
        .forEach(function(element) {

            const key =
                element.getAttribute("data-i18n");

            if (text[key]) {

                element.textContent =
                    text[key];

            }

        });


    /* PLACEHOLDERS */

    document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-i18n-placeholder"
                );

            if (text[key]) {

                element.placeholder =
                    text[key];

            }

        });

}


/* =====================================================
   SHOW STUDENT LOGIN
   ===================================================== */

    document

        .classList
        .add("hidden");


    document

        .add("hidden");


    document

    document

        .classList
        .remove("active");


    document
        .getElementById("adminBtn")
        .classList

    document
        .getElementById("registerLink")
        .style
        .display = "block";

}


/* =====================================================

   ===================================================== */

    document

    document

        .classList
        .add("hidden");


    document
        .getElementById("studentBtn")
        .classList
        .remove("active");


    document

    document

}


/* =====================================================
   SHOW ADMIN LOGIN

        .add("hidden");


    document

        .classList

    document

        .classList

    document

        .classList
        .add("active");


    document
        .getElementById("registerLink")
        .style
        .display = "none";

}


/* =====================================================
   STUDENT LOGIN
   ===================================================== */

function loginStudent() {

    const language =
        getLanguage();

    const text =
        translations[language];


    let email =
        document.getElementById(
            "studentEmail"
        ).value.trim();


    let password =
        document.getElementById(
            "studentPassword"
        ).value;


    let studentData =
        localStorage.getItem("student");


    if (studentData) {

        let student =
            JSON.parse(studentData);


        if (
            email === student.email &&
            password === student.password
        ) {

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            window.location.href =
                "Dashboard.html";

        } else {

            alert(
                text.invalidStudent
            );

        }

    } else {

        alert(
            text.noStudent
        );

    }

}


/* =====================================================
   TEACHER LOGIN
   ===================================================== */

function teacherLogin() {

    const language =
        getLanguage();

    const text =
        translations[language];


    let email =
        document.getElementById(
            "teacherEmail"
        ).value.trim();


    let password =
        document.getElementById(
            "teacherPassword"
        ).value;


    let teachersData =
        localStorage.getItem("teachers");


    if (!teachersData) {

        alert(
            text.noTeacher
        );

        return;

    }


    let teachers =
        JSON.parse(teachersData);


    let teacher =
        teachers.find(function(t) {

            return (
                t.email === email &&
                t.password === password
            );

        });


    if (teacher) {

        localStorage.setItem(
            "teacherLoggedIn",
            "true"
        );


        localStorage.setItem(
            "currentTeacherId",
            teacher.id
        );


        window.location.href =
            "Teacher.html";

    } else {

        alert(
            text.invalidTeacher
        );

    }

}
